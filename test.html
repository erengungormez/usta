<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seviye testi — USTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .quiz{max-width:760px;margin:0 auto}
  .opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--white);border:2px solid transparent;border-radius:18px;padding:20px 22px;font-size:18px;transition:border-color .15s, transform .15s}
  .opt:hover{border-color:var(--line)}
  .opt .k{width:34px;height:34px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
  .opt.right{border-color:var(--ok);background:#EAF4EE}
  .opt.right .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-2)}
  .opt.wrong .k{background:var(--red);color:#fff}
  .opt[disabled]{cursor:default}
  .hint{border-radius:18px;padding:20px 22px;margin-top:16px;font-size:16px;display:none}
  .hint.show{display:block}
  .dots{display:flex;gap:6px}
  .dots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
  .dots i.on{background:var(--ink)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--red)}
  .result{display:none;text-align:center}
</style>
</head>
<body>
<div id="site-header"></div>
<main>
<section style="padding-top:48px">
  <div class="wrap quiz" id="quiz">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <a class="btn btn-ghost btn-sm" id="back" style="padding:0">← Derse dön</a>
      <div class="dots" id="dots"></div>
    </div>
    <span class="eyebrow" id="qTag" style="display:block;margin-top:36px"></span>
    <h1 id="qText" style="font-size:clamp(32px,4.6vw,52px);margin-top:12px"></h1>
    <div id="opts" style="display:flex;flex-direction:column;gap:12px;margin-top:32px"></div>
    <div class="hint" id="hint"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="btn btn-ink" id="next" disabled>Devam</button></div>
    <p class="muted" style="font-size:14px;margin-top:28px">Bu test not vermez, yol gösterir. Yanlış cevapta ipucu alır, tekrar denersin.</p>
  </div>

  <div class="wrap result" id="result">
    <span class="eyebrow">Test tamamlandı</span>
    <h1 id="rTitle" style="margin-top:14px;font-size:clamp(44px,7vw,84px)"></h1>
    <p class="muted" id="rText" style="font-size:19px;max-width:560px;margin:18px auto 0"></p>
    <div id="rCert" style="margin-top:40px"></div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px" id="rActions"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  var c = USTA.courseById(USTA.param('id')) || USTA.courses[0];
  var lv = USTA.levelById(c.level), a = USTA.areaById(c.area);
  document.title = c.title + ' testi — USTA';
  document.getElementById('back').href = 'ders.html?id=' + c.id;
  var i = 0, firstTry = [], tried = false;

  function dots() {
    document.getElementById('dots').innerHTML = c.quiz.map(function (_, k) {
      var cls = k < i ? (firstTry[k] ? 'ok' : 'no') : k === i ? 'on' : '';
      return '<i class="' + cls + '"></i>';
    }).join('');
  }
  function show() {
    var Q = c.quiz[i]; tried = false;
    dots();
    document.getElementById('qTag').textContent = c.title + ' · Soru ' + (i + 1) + ' / ' + c.quiz.length;
    document.getElementById('qText').textContent = Q.q;
    document.getElementById('opts').innerHTML = Q.a.map(function (o, k) {
      return '<button class="opt" data-k="' + k + '"><span class="k">' + 'ABCD'[k] + '</span><span>' + USTA.esc(o) + '</span></button>';
    }).join('');
    var h = document.getElementById('hint'); h.className = 'hint'; h.innerHTML = '';
    document.getElementById('next').disabled = true;
    document.getElementById('next').textContent = i === c.quiz.length - 1 ? 'Sonucu gör' : 'Devam';
  }
  document.getElementById('opts').onclick = function (e) {
    var b = e.target.closest('.opt'); if (!b || b.disabled) return;
    var Q = c.quiz[i], k = +b.dataset.k, h = document.getElementById('hint');
    if (k === Q.c) {
      if (!tried) firstTry[i] = true;
      b.classList.add('right');
      document.querySelectorAll('.opt').forEach(function (o) { o.disabled = true; });
      h.className = 'hint show'; h.style.background = '#EAF4EE';
      h.innerHTML = '<b style="color:var(--ok)">Doğru.</b> ' + (tried ? 'İpucu işe yaradı; bu konuyu bir kez daha gözden geçirmek iyi olur.' : 'Bir sonraki basamağa hazırsın.');
      document.getElementById('next').disabled = false;
    } else {
      tried = true; firstTry[i] = false;
      b.classList.add('wrong'); b.disabled = true;
      h.className = 'hint show'; h.style.background = 'var(--white)';
      h.innerHTML = '<span class="tag">İpucu</span><p style="margin-top:6px">' + USTA.esc(Q.hint) + '</p><a href="koc.html?id=' + c.id + '" style="color:var(--red);font-size:14px;display:inline-block;margin-top:8px">Koçla konuş →</a>';
    }
  };
  document.getElementById('next').onclick = function () {
    i++;
    if (i < c.quiz.length) { show(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    finish();
  };
  function finish() {
    var right = firstTry.filter(Boolean).length, score = Math.round(100 * right / c.quiz.length);
    USTA.state.quiz[c.id] = Math.max(USTA.state.quiz[c.id] || 0, score); USTA.save();
    document.getElementById('quiz').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    var pass = score >= 60;
    document.getElementById('rTitle').innerHTML = pass ? 'Bir basamak<br>yukarı.' : 'Neredeyse<br>oldu.';
    document.getElementById('rText').textContent = c.quiz.length + ' sorunun ' + right + ' tanesini ilk denemede bildin (%' + score + '). ' +
      (pass ? lv.name + ' sertifikan hazır.' : 'Sertifika için %60 gerekiyor. İpuçlarına bir kez daha bak, sonra yeniden dene.');
    var acts = document.getElementById('rActions');
    if (pass) {
      var cert = USTA.issueCert(c.id, score);
      document.getElementById('rCert').innerHTML =
        '<div class="card" style="display:inline-flex;gap:28px;align-items:center;text-align:left;padding:28px 32px;flex-wrap:wrap;justify-content:center">' +
        '<div style="color:var(--ink)">' + USTA.qr(cert.code, 110) + '</div><div><span class="tag">' + lv.name + ' · ' + a.name + '</span>' +
        '<p class="serif" style="font-size:28px;margin-top:6px">' + USTA.esc(c.title) + '</p><p class="muted" style="font-size:14px;margin-top:6px">' + USTA.esc(cert.name) + ' · ' + cert.code + '</p></div></div>';
      acts.innerHTML = '<a class="btn btn-red btn-lg" href="sertifika.html?kod=' + cert.code + '">Sertifikamı gör</a><a class="btn btn-line btn-lg" href="dersler.html">Sonraki ders</a>';
      if (!USTA.user()) acts.innerHTML += '<p class="muted" style="width:100%;font-size:14px;margin-top:8px">Sertifikanda adının yazması için <a href="giris.html?k=1" style="color:var(--red)">ücretsiz hesap aç</a>.</p>';
    } else {
      acts.innerHTML = '<a class="btn btn-ink btn-lg" href="test.html?id=' + c.id + '">Tekrar dene</a><a class="btn btn-line btn-lg" href="ders.html?id=' + c.id + '">Derse dön</a><a class="btn btn-ghost btn-lg" href="koc.html?id=' + c.id + '">Koça sor</a>';
    }
  }
  show();
</script>
</body>
</html>
